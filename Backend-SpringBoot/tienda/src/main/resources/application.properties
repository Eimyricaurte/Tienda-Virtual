spring.application.name=tienda
server.port=8081


# Configuración de MySQL-------------------------/NombreBaseDeDatos
spring.datasource.url=jdbc:mysql://localhost:3306/tiendadb
spring.datasource.username=root
spring.datasource.password=123root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Use exact column names declared in @Column (disable default camelCase->snake_case conversion)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#-------------------
logging.file.name=logs/proyecto-universidad-ESTUDIANTE.log
logging.level.root=INFO
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%5p){green} %clr([%t]){read} %clr(%c){yellow} - %m%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %5p [%t] %c - %m%n
logging.file.max-size=10MB
logging.file.total-size-cap=100MB