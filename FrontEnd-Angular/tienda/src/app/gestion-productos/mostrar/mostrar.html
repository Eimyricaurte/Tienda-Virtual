
<header class="site-header">
  <div class="header-inner">

    <a class="brand" routerLink="/gestion-productos" (click)="resetSearch()">
  <div class="brand-icon">🤍</div>
  <div class="brand-name">
    <div class="main">Cultura y Tejido</div>
    <div class="sub">Hecho a mano</div>
  </div>
</a>

    <div class="search-wrap">
      <input #searchInput type="search" placeholder="Buscar productos" aria-label="Buscar"/>
      <button class="search-btn" aria-label="Buscar" (click)="buscar(searchInput.value)">Buscar</button>
    </div>

    <nav class="actions">
      <a class="nav-link" routerLink="/gestion-productos" [state]="{correo: correo}" (click)="resetSearch()">Productos</a>

      <button class="icon-btn cart-btn" aria-label="Carrito" [routerLink]="['/gestion-ventas']" [state]="{correo: correo}">
        <span class="cart-icon">🛒</span>
      </button>

      <a class="avatar" [routerLink]="['/gestion-usuarios/mostrar-usuario']" [state]="{correo: correo}">
        <span class="user-icon">👤</span>
      </a>
    </nav>

  </div>

  <div class="mobile-panel" [class.open]="mobileOpen">
    <a routerLink="/gestion-productos">Productos</a>
    <a routerLink="/gestion-ventas">Carrito</a>
    <a routerLink="/autenticacion">Perfil</a>
  </div>
</header>

<div class="contenedor-productos">
  <div class="producto-card" *ngFor="let p of productos">
    
    <img class="producto-img" [src]="'assets/img/' + p.imagen" alt="producto"
         (click)="verDetalle(p)" style="cursor:pointer" />

    <h3 (click)="verDetalle(p)" style="cursor:pointer">{{ p.nombre }}</h3>

    <p class="precio">$ {{ p.precio }}</p>

    <button (click)="addToCart(p)">
      <span class="cart-icon">🛒</span>
    </button>
  </div>
</div>
